<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>DOM Basics</title>
    <style>
        .highlight {
            background-color: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 0.5rem;
        }

        .bold { font-weight: bold; }
        .text-red { color: #ef4444; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1 id="title">Xin chào DOM!</h1>
    <p class="description">Đây là đoạn văn đầu tiên</p>
    <p class="description">Đây là đoạn văn thứ hai</p>
    <ul id="danh-sach">
        <li class="item">HTML</li>
        <li class="item">CSS</li>
        <li class="item">JavaScript</li>
    </ul>

    <script>
        // 0b.1
        console.log("Document:", document);
        console.log("Title:", document.title);
        console.log("Body:", document.body);
        
        // 0b.2
        const title = document.getElementById('title');
        console.log("getElementById:", title);
        const firstDesc = document.querySelector('.description');
        console.log("querySelector:", firstDesc.textContent);
        const allItems = document.querySelectorAll('.item');
        console.log("querySelectorAll:", allItems);

        // 0b.3
        title.textContent = "Tran Thi Hong Ngoc";
        firstDesc.textContent = "Tôi đang học DOM.";
        allItems[0].innerHTML = "<strong>HTML5</strong>";
        allItems.forEach(item => item.textContent += " (đã học)");

        //0b.4, 0b.5
        allItems.forEach(item => {item.classList.add('highlight');});
        allItems.forEach((item, index) => {item.setAttribute('data-learned', index);});
        document.title = "DOM Practice";
        console.log(allItems[0].classList.contains('highlight'));
        allItems[1].classList.toggle('text-red');
        allItems.forEach(item => {item.classList.remove('highlight');});

        //0b.6
        allItems.forEach((item, index) => {
            if (index%2 === 0) {
                item.style.color = '#dbeafe';
            } else {
                item.style.color = '#fce7f3';
            }
            item.style.fontSize = `${(index + 1) * 14}px`;
        });

        //0b.7
        function themMonHoc(tenMon) {
            const li = document.createElement("li");
            li.classList.add("item");
            li.textContent = tenMon;
            const ul = document.getElementById("danh-sach");
            ul.appendChild(li);
        }
        themMonHoc("Vue.js");
        themMonHoc("Node.js");
    </script>
</body>
</html>
