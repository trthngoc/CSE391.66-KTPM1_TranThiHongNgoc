<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hello JavaScript</title>
</head>
<body>
    <h1>Bài tập đầu tiên với JavaScript</h1>
    <p>Mở Console (F12 → Console) để xem kết quả</p>

    <script>
        console.log("Xin chào thế giới!");
        console.log("Tôi đang học JavaScript");
        console.log(2026);

        // 0.2 - Khai báo biến
        let ten = "Minh";
        let tuoi = 20;
        let laSinhVien = true;

        console.log("Tên:", ten);        // "Tên: Minh"
        console.log("Tuổi:", tuoi);      // "Tuổi: 20"
        console.log("Sinh viên:", laSinhVien); // "Sinh viên: true"

        // Thay đổi giá trị
        tuoi = 21;
        console.log("Tuổi mới:", tuoi);  // "Tuổi mới: 21"

        // ===== CONST — hằng số, KHÔNG thể thay đổi =====
        const PI = 3.14159;
        const TEN_TRUONG = "Đại học Thủy Lợi";

        console.log("PI =", PI);
        console.log("Trường:", TEN_TRUONG);

        // ❌ Thử thay đổi const sẽ bị lỗi:
        // PI = 3.14;  // TypeError: Assignment to constant variable

        // ===== VAR — cách cũ, ít dùng =====
        var monHoc = "CSE391";
        console.log("Môn:", monHoc);

        // 0.3 - Các kiểu dữ liệu cơ bản
        let tenMonHoc = "CSE391";
        let soTinChi = 3;
        let laMonBatBuoc = true;
        let diemSo = 5;
        console.log("Tên môn:", tenMonHoc); // "Tên môn: CSE391"
        console.log("Số tín chỉ:", soTinChi); // "Số tín chỉ: 3"
        console.log("Môn bắt buộc:", laMonBatBuoc); // "Môn bắt buộc: true"
        console.log("Điểm số:", diemSo); // "Điểm số: undefined"

        // 0.4 - Template literals (chuỗi mẫu)
        let sanPham = "Laptop";
        let soLuong = 2;
        let donGia = 15000000;
        let hoaDon = `Hóa đơn: ${soLuong} x ${sanPham} = ${soLuong * donGia} VND`;
        console.log(hoaDon);

        // 0.5 - Toán tử cơ bản
        const pi = 3.14159;
        let banKinh = 5;
        let dienTich = pi * banKinh * banKinh;
        let chuVi = 2 * pi * banKinh;
        console.log("Diện tích hình tròn:", dienTich);
        console.log("Chu vi hình tròn:", chuVi);

        // 0.6 - Toán tử so sánh
        let diem = 7.5;
        let diemChuyenCan = 9;
        if (diem >= 5 && diemChuyenCan >= 8) {
            console.log("Đạt");
        } else {
            console.log("Không đạt");
        }
        if (diem >= 8.5) {
            console.log("Giỏi");
        } else if (diem >= 7) {
            console.log("Khá");
        } else if (diem >= 5) {
            console.log("Trung bình");
        } else {
            console.log("Yếu");
        }

        // 0.7 - Kiểu dữ liệu Array
        let mAYT = ["Phở", "Bún chả", "Cơm tấm", "Bánh mì", "Gỏi cuốn"];
        console.log("Món ăn yêu thích 1:", mAYT[0]);
        console.log(`Món ăn yêu thích ${mAYT.length}:`, mAYT[mAYT.length - 1]);
        mAYT.unshift("Bánh xèo");
        mAYT.pop();
        mAYT.forEach((mon, index) => {
            console.log(`Món ăn ${index + 1}: ${mon}`);
        });
        console.log(mAYT.includes("Phở"));

        // 0.8 - Kiểu dữ liệu Object
        let hoSo = {
            hoTen : "Nguyễn Văn A",
            tuoi : 22,
            nganh : "CNTT",
            soThich : ["Đọc sách", "Nghe nhạc", "Đi dạo"],
            diaChi : {
                thanhPho : "Hà Nội",
                quan : "Cầu Giấy",
                phuong : "Dịch Vọng"
            }
        };
        console.log(`Tôi là ${hoSo.hoTen}, ${hoSo.tuoi} tuổi, học ngành ${hoSo.nganh}.`);
        console.log("Sở thích 1:", hoSo.soThich[0]);
        console.log(`Địa chỉ: phường ${hoSo.diaChi.phuong}, quận ${hoSo.diaChi.quan}, thành phố ${hoSo.diaChi.thanhPho}`);
        hoSo.email = "abc123@gmail.com";
        console.log("Email:", hoSo.email);

        // 0.9 - Hàm cơ bản
        function maxHaiSo(a, b) {
            if (a > b) {
                return a;
            } else if (b > a) {
                return b;
            } else {
                return "Hai số bằng nhau";
            }
        }
        function laNamNhuan(nam) {
            if ((nam % 4 === 0 && nam % 100 !== 0) || (nam % 400 === 0)) {
                return true;
            } else {
                return false;
            }
        }
        const gioiThieu = (ten, tuoi, nganh) => {
            return `Tôi là ${ten}, ${tuoi} tuổi, học ${nganh}.`;
        }
        function tinhGiaBan(giaGoc, giamGia=0) {
            return giaGoc * (1 - giamGia/100);
        }
        console.log("Max của 5 và 10:", maxHaiSo(5, 10));
        console.log("Năm 2020 có phải năm nhuận?", laNamNhuan(2020));
        console.log(gioiThieu("Minh", 20, "CNTT"));
        console.log("Giá bán sau giảm 20%:", tinhGiaBan(100000, 20));
    </script>
</body>
</html>

<!-- console.log() sẽ in ra trong tab console của DevTool, còn document.write() sẽ in ngay tại trang web-->
